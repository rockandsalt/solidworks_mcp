// sld_mcp.proto : the contract between the Rust MCP server (gRPC client)
// and the sld_mcp SolidWorks add-in (gRPC server).
//
// Code is generated from this file on both sides:
//   - Rust: mcp_server/build.rs (tonic-prost-build)
//   - C++:  sld_mcp/sld_mcp.vcxproj, target SldMcpGenerateProto (vcpkg's protoc + grpc_cpp_plugin)
//
// The add-in listens on 127.0.0.1:<port>; the port defaults to 50551 and can
// be overridden on both sides with the SLD_MCP_PORT environment variable.
syntax = "proto3";

package sld_mcp.v1;

// All lengths on the wire are in meters, the SolidWorks API's native unit.
// Converting from user-facing units (mm) is the MCP server's job.
service SolidWorks {
  // Returns the document SolidWorks currently has active, if any.
  rpc GetActiveDocument(GetActiveDocumentRequest) returns (GetActiveDocumentResponse);

  // Creates a new part from the user's default part template and makes it
  // the active document.
  rpc NewPart(NewPartRequest) returns (NewPartResponse);

  // Creates a new, empty assembly from the user's default assembly template
  // and makes it the active document.
  rpc NewAssembly(NewAssemblyRequest) returns (NewAssemblyResponse);

  // Creates a new sketch on one of the active part's standard planes
  // containing a single center rectangle, then closes the sketch.
  // Fails with FAILED_PRECONDITION if the active document isn't a part or
  // a sketch is already open for editing.
  rpc CreateRectangleSketch(CreateRectangleSketchRequest) returns (CreateRectangleSketchResponse);

  // Draws lines, circles, arcs, splines and/or points into a sketch of the
  // active part -- a new one on a plane or face, or an existing one by name
  // -- then closes the sketch. Coincident end points are merged, so a chain
  // of entities that ends where it started forms a closed contour. All or
  // nothing: if any entity fails, none of them are kept (and a new sketch is
  // deleted). Fails with FAILED_PRECONDITION if the active document isn't a
  // part or a sketch is already open for editing.
  rpc AddSketchEntities(AddSketchEntitiesRequest) returns (AddSketchEntitiesResponse);

  // Extrudes a closed sketch of the active part into a boss (adds material,
  // merging with any existing body) with a blind end condition.
  // Fails with FAILED_PRECONDITION if the active document isn't a part, a
  // sketch is open for editing, or there is no sketch to extrude; and with
  // NOT_FOUND if a named sketch doesn't exist.
  rpc ExtrudeSketch(ExtrudeSketchRequest) returns (ExtrudeSketchResponse);

  // Revolves a closed sketch of the active part about an axis into a boss
  // (merging with any existing body) or a cut (IFeatureManager::
  // FeatureRevolve2). Same preconditions and sketch defaulting as
  // ExtrudeSketch; INVALID_ARGUMENT for a bad angle or an axis that can't
  // be one, FAILED_PRECONDITION when no axis is given and the sketch doesn't
  // have exactly one centerline, or SolidWorks won't make the feature.
  rpc RevolveSketch(RevolveSketchRequest) returns (RevolveSketchResponse);

  // Sweeps a closed profile sketch, or a circle of a given diameter, along
  // a path (a sketch, 3D sketch or curve feature) into a boss (merging with
  // any existing body) or a cut (IFeatureManager::InsertProtrusionSwept4 /
  // InsertCutSwept5). Same preconditions as ExtrudeSketch; INVALID_ARGUMENT
  // for bad sizes or a path that is the profile, NOT_FOUND for unknown
  // names, FAILED_PRECONDITION when SolidWorks won't make the feature.
  rpc SweepSketch(SweepSketchRequest) returns (SweepSketchResponse);

  // Rounds edges of the active part with a constant-radius fillet
  // (IFeatureManager::FeatureFillet3), or bevels them with a chamfer
  // (IFeatureManager::InsertFeatureChamfer). Edges are given directly or
  // as faces (all of a face's edges). Same preconditions as ExtrudeSketch;
  // INVALID_ARGUMENT for bad sizes or references that aren't edges or
  // faces, NOT_FOUND for stale ids, FAILED_PRECONDITION when SolidWorks
  // won't make the feature (e.g. a radius too big for the edges).
  rpc FilletEdges(FilletEdgesRequest) returns (EdgeFeatureResponse);
  rpc ChamferEdges(ChamferEdgesRequest) returns (EdgeFeatureResponse);

  // Mirrors features (by persist_id or name) or bodies of the active part
  // about a plane: a planar face, a reference plane or a default plane
  // (IFeatureManager::InsertMirrorFeature2). Same preconditions as
  // ExtrudeSketch; INVALID_ARGUMENT for a plane that isn't one or features
  // that can't be mirrored, NOT_FOUND for stale ids or unknown names,
  // FAILED_PRECONDITION when SolidWorks won't make the feature (nothing is
  // left behind then).
  rpc MirrorFeatures(MirrorFeaturesRequest) returns (MirrorFeaturesResponse);

  // Mirrors segments and points of a 2D sketch of the active part about a
  // line of the same sketch (IModelDoc2::SketchMirror): the copies get
  // symmetric relations to the originals, which stay; a line that ends on
  // the axis at a right angle is extended across it instead. Then closes the
  // sketch, rebuilds and reports the new entities, the contours, the
  // definition state and features that now have errors. FAILED_PRECONDITION
  // if a sketch is already open or SolidWorks mirrors nothing.
  rpc MirrorSketchEntities(MirrorSketchEntitiesRequest) returns (MirrorSketchEntitiesResponse);

  // Patterns features (by persist_id or name) or bodies of the active part
  // along one or two directions (IFeatureManager::FeatureLinearPattern5) or
  // round an axis (FeatureCircularPattern5). Same preconditions as
  // ExtrudeSketch; INVALID_ARGUMENT for a direction or axis that can't be
  // one, NOT_FOUND for stale ids or unknown names, FAILED_PRECONDITION when
  // SolidWorks won't make the pattern (nothing is left behind then).
  rpc PatternFeatures(PatternFeaturesRequest) returns (PatternFeaturesResponse);

  // Copies segments and points of a 2D sketch of the active part in a row or
  // grid (ISketchManager::CreateLinearSketchStepAndRepeat) or round a center
  // point (CreateCircularSketchStepAndRepeat). Then closes the sketch,
  // rebuilds and reports the new entities, the contours, the definition
  // state and features that now have errors. FAILED_PRECONDITION if a sketch
  // is already open or SolidWorks copies nothing.
  rpc PatternSketchEntities(PatternSketchEntitiesRequest) returns (PatternSketchEntitiesResponse);

  // Read-only look at the active part or assembly: its features, bodies,
  // faces and/or edges with their geometry, and in an assembly its
  // components and mates. Every entity comes with a persist_id that other
  // RPCs accept to target it (e.g. sketching on a face, mating two faces).
  // Fails with FAILED_PRECONDITION if the active document is neither.
  rpc InspectModel(InspectModelRequest) returns (InspectModelResponse);

  // Read-only: the active part's (or assembly's visible components')
  // display tessellation (triangles per face) and edges as polylines, for
  // the MCP server to render pictures from. Fails with FAILED_PRECONDITION
  // if the active document is neither a part nor an assembly.
  rpc GetMesh(GetMeshRequest) returns (GetMeshResponse);

  // Read-only look at one 2D sketch: its segments and points (with IDs
  // other sketch RPCs take), dimensions, relations, and how fully defined
  // it and each entity are. Doesn't open the sketch for editing.
  rpc InspectSketch(InspectSketchRequest) returns (InspectSketchResponse);

  // Adds dimensions to a sketch, optionally driving each to a new value
  // (which moves the geometry). All or nothing: if any dimension can't be
  // added, would over-define the sketch, or the values can't be solved,
  // the values are put back and the new dimensions deleted. Opens and
  // closes the sketch; FAILED_PRECONDITION if a sketch is already open.
  rpc AddSketchDimensions(AddSketchDimensionsRequest) returns (AddSketchDimensionsResponse);

  // Adds geometric relations (horizontal, coincident, tangent, ...) to a
  // sketch. All or nothing, best effort: relations added by a failed call
  // are deleted again, but geometry they moved stays where it went.
  rpc AddSketchRelations(AddSketchRelationsRequest) returns (AddSketchRelationsResponse);

  // SolidWorks' "Fully Define Sketch": adds the relations and dimensions
  // still needed to fully define a sketch, locking the geometry where it
  // is. Dimensions are measured from the sketch origin unless datums are
  // given.
  rpc FullyDefineSketch(FullyDefineSketchRequest) returns (FullyDefineSketchResponse);

  // Changes the value of an existing dimension by its full name, e.g.
  // "D1@Sketch1" or "D1@Boss-Extrude1" (or in an assembly, a distance or
  // angle mate's "D1@Distance1"), and rebuilds.
  rpc SetDimensionValue(SetDimensionValueRequest) returns (SetDimensionValueResponse);

  // Sets the tolerance of an existing dimension of the active part,
  // assembly or drawing, found by its full name ("D1@Sketch1",
  // "RD1@Drawing View1", "D1@Boss-Extrude1@block.Part" in a drawing):
  // tolerance type, upper/lower deviation, fit classes, and optionally the
  // decimal places shown (IDimensionTolerance + IDisplayDimension::
  // SetPrecision3). A model dimension shown in a drawing is the model's
  // own, so its tolerance changes in the model too. All or nothing: if
  // SolidWorks refuses part of the change, the old tolerance is put back.
  // NOT_FOUND if there's no such dimension; INVALID_ARGUMENT if the values
  // don't suit the type or the dimension (angles vs lengths).
  rpc SetDimensionTolerance(SetDimensionToleranceRequest) returns (SetDimensionToleranceResponse);

  // Hole Wizard: standard holes (clearance/drilled, counterbore, countersink
  // or tapped), sized from SolidWorks' hole standards, at either
  //   - the sketch points of an existing sketch, which becomes the hole
  //     feature's placement sketch (so its dimensions keep locating the
  //     holes) -- the usual way to make holes by hand; or
  //   - points on a planar face of the active part; the feature then gets a
  //     new placement sketch that the sketch RPCs can dimension.
  // All the holes are one feature. Fails with INVALID_ARGUMENT if a location
  // isn't on the face, and with FAILED_PRECONDITION if the active document
  // isn't a part, a sketch is open, the sketch isn't usable, or SolidWorks
  // rejects the hole (e.g. a size the fastener type doesn't have).
  rpc HoleWizard(HoleWizardRequest) returns (HoleWizardResponse);

  // Adds a mate between two components of the active assembly (faces,
  // edges, reference planes/axes, or whole components for a lock mate) and
  // solves it, moving the components that aren't fixed. All or nothing:
  // a mate SolidWorks rejects, or that leaves the assembly over-defined or
  // unsolvable, is deleted again (components the solver already moved
  // stay where they went). Fails with FAILED_PRECONDITION if the active
  // document isn't an assembly, a sketch is open, or a component is being
  // edited in context.
  rpc AddMate(AddMateRequest) returns (AddMateResponse);

  // Inserts a part or subassembly into the active assembly, once per
  // placement (IAssemblyDoc::AddComponents3, which loads the file itself):
  // a .SLDPRT / .SLDASM file, or another instance of a component already
  // in it (its file and configuration). Each new component's origin and
  // axes go where its placement says. All or nothing. Fails with
  // INVALID_ARGUMENT for the assembly itself or a configuration the file
  // doesn't have, and with FAILED_PRECONDITION as AddMate.
  rpc InsertComponents(InsertComponentsRequest) returns (InsertComponentsResponse);

  // Read-only: the active part's (or assembly's) 3D annotations, i.e. its
  // PMI / MBD data -- what the MBD Dimension (DimXpert) tools and the
  // annotation tools put on the model: dimensions with their tolerances,
  // datums, geometric tolerance frames, datum targets, surface finish
  // symbols, notes, ... -- each with the faces/edges it's attached to.
  // Codes are passed through as SolidWorks' own enum values; naming them is
  // the MCP server's job. Fails with FAILED_PRECONDITION if the active
  // document is neither a part nor an assembly.
  rpc InspectAnnotations(InspectAnnotationsRequest) returns (InspectAnnotationsResponse);

  // Read-only look at the active drawing: its sheets (size, scale,
  // projection), the drawing views on each (type, orientation, scale, the
  // model it shows, where it sits on the sheet and how model space maps
  // onto the sheet), on request the visible edges / silhouette edges /
  // vertices of some views -- what drawing dimensions attach to -- and the
  // annotations (dimensions, notes, ...) in each view. Fails with
  // FAILED_PRECONDITION if the active document isn't a drawing.
  rpc InspectDrawing(InspectDrawingRequest) returns (InspectDrawingResponse);

  // Adds dimensions to views of the active drawing, between entities that
  // InspectDrawing listed, with their text at given sheet positions.
  // Drawing dimensions measure the model; they don't drive it. All or
  // nothing: if one can't be added, the ones added by this call are
  // deleted again. FAILED_PRECONDITION if the active document isn't a
  // drawing, NOT_FOUND if an entity is no longer in its view.
  rpc AddDrawingDimensions(AddDrawingDimensionsRequest) returns (AddDrawingDimensionsResponse);

  // SolidWorks' "Model Items": inserts the model's own dimensions (and
  // optionally other annotations) into views of the active drawing
  // (IDrawingDoc::InsertModelAnnotations3). Reports what each view gained.
  rpc InsertModelItems(InsertModelItemsRequest) returns (InsertModelItemsResponse);

  // A picture of one sheet of the active drawing as SolidWorks prints it:
  // the sheet saved as an image (PNG, else JPEG) with the "print capture"
  // export options at the sheet's own size, plus the sheet's size and its
  // views' outlines for mapping pixels to sheet coordinates. The export
  // options and the user's active sheet are put back after.
  // FAILED_PRECONDITION if the active document isn't a drawing or
  // SolidWorks won't save the image; NOT_FOUND for an unknown sheet.
  rpc RenderDrawing(RenderDrawingRequest) returns (RenderDrawingResponse);

  // Deletes features of the active part or assembly the way the Delete key
  // does (IModelDocExtension::DeleteSelection2): sketches, extrudes, cuts,
  // holes, fillets, reference geometry, ..., and in an assembly its mates
  // and assembly features. Features that depend on the deleted ones
  // (children, e.g. a fillet on an extrude's edges, or the extrude of a
  // sketch) are deleted too only with children = DELETE; with REFUSE (the
  // default) such a request fails with FAILED_PRECONDITION naming them, and
  // with KEEP they stay and lose those references. Sketches a deleted
  // feature absorbed (an extrude's profile) stay in the tree unless
  // delete_absorbed. Rebuilds and reports what's gone and which remaining
  // features now have errors. FAILED_PRECONDITION if the active document
  // isn't a part or an assembly, a sketch is open, or a feature is one of
  // the tree's fixed items (origin, default planes, folders), a component,
  // or a feature inside a component (open the part to delete those).
  rpc DeleteFeatures(DeleteFeaturesRequest) returns (DeleteFeaturesResponse);

  // Deletes segments (lines, arcs, circles, splines, ...) and standalone
  // points from a 2D sketch of the active part, together with the
  // dimensions and relations attached to them, then closes the sketch,
  // rebuilds and reports what's left: the sketch's definition state, its
  // contours, and features (e.g. the sketch's extrude) that now have
  // errors. A segment's end or center point can only go with its segment
  // (INVALID_ARGUMENT otherwise). Checks every entity before deleting
  // anything; FAILED_PRECONDITION if a sketch is already open.
  rpc DeleteSketchEntities(DeleteSketchEntitiesRequest) returns (DeleteSketchEntitiesResponse);

  // What's wrong with the active part's or assembly's feature tree, e.g.
  // after a feature or mate was deleted: rebuilds (unless skip_rebuild),
  // then reports every feature that fails or warns (IFeature::GetErrorCode2
  // plus IModelDocExtension::GetWhatsWrong) with its parents and children,
  // every sketch with dangling / over-defining / broken relations or
  // dimensions or a missing sketch plane, and for mates which mated entity
  // is gone. Changes nothing but the rebuild. FAILED_PRECONDITION if the
  // active document is neither a part nor an assembly, or a sketch is open.
  rpc DiagnoseModel(DiagnoseModelRequest) returns (DiagnoseModelResponse);

  // Changes a boss- or cut-extrude of the active part, as Edit Feature
  // does: end condition (blind, through all, mid plane, up to next),
  // depth, direction, a second direction, draft, and for cuts the side to
  // cut (IExtrudeFeatureData2 + IFeature::ModifyDefinition). Unset fields
  // keep their value; with none set it only reports the definition. All or
  // nothing: if SolidWorks rejects the change, or the feature fails to
  // rebuild with it, the old definition is put back. Features downstream
  // that now fail are reported, not undone. FAILED_PRECONDITION if the
  // active document isn't a part or a sketch is open; INVALID_ARGUMENT if
  // the feature isn't an extrude.
  rpc EditExtrude(EditExtrudeRequest) returns (EditExtrudeResponse);

  // Changes a mate of the active assembly: its type, the two entities it
  // mates, alignment, flip, distance / angle, lock rotation
  // (IAssemblyDoc::EditMate4 with the mate and its entities selected).
  // Unset fields keep their value. All or nothing like AddMate: a change
  // SolidWorks rejects, or that leaves the mate over-defined or unsolvable,
  // is undone by editing the mate back (components the solver moved may
  // stay moved). Preconditions as AddMate.
  rpc EditMate(EditMateRequest) returns (EditMateResponse);

  // Saves the active document, silently (no dialogs): to its own file
  // (IModelDoc2::Save3), or with a path as a new file / an export in the
  // format of the path's extension (IModelDocExtension::SaveAs, with the
  // user's export options). Native saves also save modified documents it
  // references (a drawing's part, an assembly's components). Whether it
  // worked comes back in `saved` with SolidWorks' error / warning bits,
  // which the MCP server names. FAILED_PRECONDITION if no document is open,
  // the document was never saved and no path is given,
  // the format doesn't suit the document type, or another open document is
  // that file.
  rpc SaveDocument(SaveDocumentRequest) returns (SaveDocumentResponse);

  // Opens a part, assembly or drawing file silently (ISldWorks::OpenDoc6)
  // and makes it the active document; a document that's already open is
  // just activated. A file SolidWorks can't open comes back with
  // `opened` false and its error bits (swFileLoadError_e) for the MCP
  // server to name; warnings (missing references, ...) likewise.
  rpc OpenDocument(OpenDocumentRequest) returns (OpenDocumentResponse);
  // Adds a reference plane, axis, point (or several points along a curve)
  // or coordinate system to the active part, built like the Reference
  // Geometry commands from references: model geometry (faces, edges,
  // vertices, reference features), sketch entities (segments and points of
  // closed 2D sketches), the origin or the default planes. Rebuilds and
  // returns the new features with where they ended up. All or nothing: a
  // feature that fails to rebuild is deleted again. FAILED_PRECONDITION if
  // the active document isn't a part, a sketch is open, or SolidWorks
  // can't make the feature from these references; NOT_FOUND if a
  // reference no longer resolves.
  rpc CreateReferenceGeometry(CreateReferenceGeometryRequest) returns (CreateReferenceGeometryResponse);
}

// ---------------------------------------------------------------------------
// Shared geometry types. All coordinates are in the part's model space.

message Vec3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

// Axis-aligned bounding box.
message Box3 {
  Vec3 min = 1;
  Vec3 max = 2;
}

message GetActiveDocumentRequest {}

message GetActiveDocumentResponse {
  // Unset when SolidWorks has no document open.
  Document document = 1;
  // Different for every SolidWorks process (its id + start time): titles
  // of documents never saved ("Part1") repeat after SolidWorks restarts, so
  // the MCP server keys those by session + title.
  string session = 2;
}

message Document {
  // Window title as SolidWorks shows it (IModelDoc2::GetTitle).
  string title = 1;
  // Set by InspectModel, GetMesh, GetActiveDocument, SaveDocument and
  // OpenDocument.
  DocumentType type = 2;
  // The file (IModelDoc2::GetPathName); empty for a document never saved.
  // Set by GetActiveDocument, SaveDocument and OpenDocument.
  string path = 3;
}

enum DocumentType {
  DOCUMENT_TYPE_UNSPECIFIED = 0;
  DOCUMENT_TYPE_PART = 1;
  DOCUMENT_TYPE_ASSEMBLY = 2;
  DOCUMENT_TYPE_DRAWING = 3;
}

message NewPartRequest {}

message NewPartResponse {
  Document document = 1;
}

message NewAssemblyRequest {}

message NewAssemblyResponse {
  Document document = 1;
}

message SaveDocumentRequest {
  // Empty: save the document to its own file. Otherwise an absolute path:
  // a native file of the document's type (.SLDPRT / .SLDASM / .SLDDRW) is
  // a Save As (the document becomes that file, unless `copy`), any other
  // extension an export (always a copy). An existing file is overwritten:
  // checking is the MCP server's job.
  string path = 1;
  // Save As copy: write `path` but keep the document as it was.
  bool copy = 2;
  // The document types the path's format holds (the MCP server's table);
  // empty = any.
  repeated DocumentType allowed_types = 3;
}

message SaveDocumentResponse {
  // The document after saving (its path is the new one after a Save As).
  Document document = 1;
  // The file written.
  string saved_path = 2;
  // SolidWorks reported success, or the file was written anyway (a part
  // with rebuild errors saves but reports swFileSaveWithRebuildError).
  bool saved = 3;
  // swFileSaveError_e / swFileSaveWarning_e bits.
  int32 errors = 4;
  int32 warnings = 5;
}

message OpenDocumentRequest {
  // Absolute path of a .SLDPRT, .SLDASM or .SLDDRW file.
  string path = 1;
  // From the extension.
  DocumentType type = 2;
  bool read_only = 3;
}

message OpenDocumentResponse {
  // Unset when SolidWorks couldn't open it.
  Document document = 1;
  bool opened = 2;
  // It was open already; it's only been activated.
  bool already_open = 3;
  // swFileLoadError_e / swFileLoadWarning_e bits.
  int32 errors = 4;
  int32 warnings = 5;
}

// The three default reference planes every part starts with. Resolved by
// position in the feature tree (1st/2nd/3rd RefPlane), not by name, so it
// works with localized or renamed planes.
enum Plane {
  PLANE_UNSPECIFIED = 0;
  PLANE_FRONT = 1;
  PLANE_TOP = 2;
  PLANE_RIGHT = 3;
}

message CreateRectangleSketchRequest {
  // Ignored when `on_persist_id` is set.
  Plane plane = 1;
  // Rectangle center in the sketch's 2D coordinates, meters. Ignored when
  // `center_model` is set.
  double center_x = 2;
  double center_y = 3;
  // Full side lengths, meters, along the sketch's X and Y axes. Both must be
  // > 0; equal for a square.
  double width = 4;
  double height = 5;
  // Sketch on this entity instead of `plane`: a persist_id from InspectModel
  // of a planar face or a reference plane feature. NOT_FOUND if it no longer
  // resolves, INVALID_ARGUMENT if it isn't something you can sketch on.
  bytes on_persist_id = 6;
  // Rectangle center as a point in model space, meters, projected onto the
  // sketch plane. When unset on a face, defaults to the center of the face's
  // bounding box.
  Vec3 center_model = 7;
}

// Where a sketch sits in model space: maps the sketch's 2D axes to 3D.
message SketchFrame {
  Vec3 origin = 1;  // sketch (0, 0)
  Vec3 x_axis = 2;  // unit vector along sketch X (rectangle width)
  Vec3 y_axis = 3;  // unit vector along sketch Y (rectangle height)
  Vec3 normal = 4;  // unit sketch normal; a boss extrudes along it
}

message CreateRectangleSketchResponse {
  // Feature-tree name of the new sketch, e.g. "Sketch1".
  string sketch_name = 1;
  SketchFrame frame = 2;
  // The rectangle's center in model space, meters.
  Vec3 center_model = 3;
  // The segments the rectangle is made of (sides, plus any construction
  // geometry SolidWorks adds), with their IDs.
  repeated SketchItem items = 4;
}

// ---------------------------------------------------------------------------
// AddSketchEntities

message AddSketchEntitiesRequest {
  // Add to this existing 2D sketch, e.g. "Sketch1". When set, `plane` and
  // `on_persist_id` must be left unset. Empty means create a new sketch.
  string sketch_name = 1;
  // New sketches: one of the default planes, or (instead) a planar face or
  // reference plane feature by persist_id, as in CreateRectangleSketch.
  Plane plane = 2;
  bytes on_persist_id = 3;
  // How every point below is given:
  //   false: sketch 2D coordinates (x, y; z is ignored), meters.
  //   true:  model-space points, meters, projected onto the sketch plane.
  bool model_space = 4;
  // Drawn in order. At least one.
  repeated SketchEntity entities = 5;
}

message SketchEntity {
  // Construction (reference) geometry: shown dashed and ignored by
  // features. Points are always construction-like; ignored for them.
  bool construction = 1;
  oneof geometry {
    SketchLine line = 2;
    SketchCircle circle = 3;
    SketchArc arc = 4;
    SketchSpline spline = 5;
    SketchPointEntity point = 6;
  }
}

message SketchLine {
  Vec3 start = 1;
  Vec3 end = 2;
}

message SketchCircle {
  Vec3 center = 1;
  double radius = 2;  // meters, > 0
}

// From `start` to `end`, defined by exactly one of:
//   center:  arc around this point; the radius is |start - center| and
//            `end` only sets where it stops (it's moved onto that radius).
//            Runs counterclockwise unless `clockwise`, as seen looking at
//            the sketch from the side its normal points to.
//   through: a third point on the arc, between start and end.
message SketchArc {
  Vec3 start = 1;
  Vec3 end = 2;
  Vec3 center = 3;
  Vec3 through = 4;
  bool clockwise = 5;  // center arcs only
}

// Interpolating spline through the points, in order.
message SketchSpline {
  repeated Vec3 points = 1;  // at least 2 (3 when closed)
  // Loop back to the first point, making a closed spline.
  bool closed = 2;
}

message SketchPointEntity {
  Vec3 position = 1;
}

message AddSketchEntitiesResponse {
  // Feature-tree name of the sketch drawn into.
  string sketch_name = 1;
  // True when the sketch was created by this call.
  bool created_sketch = 2;
  SketchFrame frame = 3;
  // How many entities were drawn (one per request entity).
  int32 entity_count = 4;
  // The whole sketch's contours after the change. Unset if SolidWorks
  // couldn't report them.
  SketchContours contours = 5;
  // What was drawn, in request order, with IDs for dimensioning. A drawn
  // point that was merged into another entity's end point is left out.
  repeated SketchItem items = 6;
}

// Chains of connected segments in a sketch. Boss/cut extrusions need
// closed ones.
message SketchContours {
  int32 closed = 1;
  int32 open = 2;
}

message ExtrudeSketchRequest {
  // Feature-tree name of the sketch to extrude, e.g. "Sketch1". Empty means
  // the most recent sketch not yet used by any feature.
  string sketch_name = 1;
  // Total extrusion depth, meters. Must be > 0.
  double depth = 2;
  // Extrude away from the sketch plane's normal instead of along it.
  // Ignored when mid_plane is set.
  bool reverse_direction = 3;
  // Extrude symmetrically, depth/2 to each side of the sketch plane.
  bool mid_plane = 4;
  // Remove material (cut-extrude) instead of adding it.
  bool cut = 5;
  // Cuts only: go through the whole part; `depth` and `mid_plane` are
  // ignored.
  bool through_all = 6;
}

message ExtrudeSketchResponse {
  // Feature-tree name of the new feature, e.g. "Boss-Extrude1".
  string feature_name = 1;
  // The sketch that was extruded (useful when the request left it empty).
  string sketch_name = 2;
  // How fully defined that sketch was.
  DefinitionStatus sketch_status = 3;
  // Cuts only: the default direction (against the sketch normal) removed
  // nothing, e.g. a sketch on a plane with the material on its normal side,
  // so the cut went the other way, as reverse_direction would have.
  bool direction_flipped = 4;
}

message RevolveSketchRequest {
  // Feature-tree name of the sketch to revolve, e.g. "Sketch1". Empty means
  // the most recent sketch not yet used by any feature.
  string sketch_name = 1;
  // The axis of revolution: a sketch line (usually a centerline of the
  // sketch itself), a straight model edge or a reference axis. Unset means
  // the sketch's only centerline (construction line).
  GeometryRef axis = 2;
  // Radians, more than 0 and at most 2*pi (a full turn). With mid_plane the
  // total, split evenly across both sides of the sketch plane.
  double angle = 3;
  // Revolve the other way round the axis. Ignored with mid_plane.
  bool reverse_direction = 4;
  // Revolve symmetrically to both sides of the sketch plane.
  bool mid_plane = 5;
  // Remove material (cut-revolve) instead of adding it.
  bool cut = 6;
}

message RevolveSketchResponse {
  // Feature-tree name of the new feature, e.g. "Revolve1", "Cut-Revolve1".
  string feature_name = 1;
  // The sketch that was revolved (useful when the request left it empty).
  string sketch_name = 2;
  // How fully defined that sketch was.
  DefinitionStatus sketch_status = 3;
  // What the axis was, e.g. "sketch line of Sketch1", "edge", "Axis1".
  string axis = 4;
  // The axis' sketch line, when it is one (e.g. the centerline found when
  // the request gave no axis).
  SketchItemRef axis_item = 5;
  // Cuts only, partial turns: the default direction removed nothing, so
  // the cut went the other way, as reverse_direction would have.
  bool direction_flipped = 6;
}

message SweepSketchRequest {
  // Feature-tree name of the profile sketch (a closed 2D sketch). Empty
  // means the most recent 2D sketch not yet used by any feature, other than
  // the path. Must be empty with circle_diameter.
  string sketch_name = 1;
  // Feature-tree name of the path: a 2D or 3D sketch (one open or closed
  // chain of curves) or a curve feature such as a helix.
  string path = 2;
  // Meters. More than 0: sweep a circle of this diameter, centered on the
  // path, instead of a profile sketch.
  double circle_diameter = 3;
  // Radians: the profile turns by this much from the start of the path to
  // its end. 0 = no twist (the profile follows the path).
  double twist_angle = 4;
  // Remove material (cut-sweep) instead of adding it.
  bool cut = 5;
}

message SweepSketchResponse {
  // Feature-tree name of the new feature, e.g. "Sweep1", "Cut-Sweep1".
  string feature_name = 1;
  // The profile sketch (useful when the request left it empty); empty for a
  // circular profile.
  string sketch_name = 2;
  // How fully defined the profile sketch was.
  DefinitionStatus sketch_status = 3;
  // The path's feature-tree name.
  string path = 4;
}

message FilletEdgesRequest {
  // Edges to round, or faces (all their edges), by model_persist_id.
  repeated GeometryRef edges = 1;
  // Meters, more than 0.
  double radius = 2;
  // Also round the edges tangent to the given ones (SolidWorks' default).
  bool tangent_propagation = 3;
}

message ChamferEdgesRequest {
  // Edges to bevel, or faces (all their edges), by model_persist_id.
  repeated GeometryRef edges = 1;
  // Meters, more than 0: how far the chamfer reaches into the faces on
  // both sides (equal distance), or into the first face when `angle` or
  // `other_distance` is set.
  double distance = 2;
  // Radians, in (0, pi/2): angle-distance chamfer. 0 = not set.
  double angle = 3;
  // Meters: distance-distance chamfer, how far it reaches into the second
  // face. 0 = not set. At most one of angle / other_distance.
  double other_distance = 4;
  // Swap which face `distance` is measured on (angle-distance and
  // distance-distance only).
  bool flip = 5;
  // Also bevel the edges tangent to the given ones (SolidWorks' default).
  bool tangent_propagation = 6;
}

message EdgeFeatureResponse {
  // Feature-tree name of the new feature, e.g. "Fillet1", "Chamfer1".
  string feature_name = 1;
}

message MirrorFeaturesRequest {
  // What to mirror about: a planar face or reference plane by
  // model_persist_id, a reference plane by feature_name, or a default plane.
  GeometryRef plane = 1;
  // Features to mirror (copies of them on the other side of the plane).
  // Not with `bodies`.
  repeated FeatureTarget features = 2;
  // Whole bodies to mirror, by persist_id from InspectModel. Not with
  // `features`.
  repeated bytes bodies = 3;
  // Bodies only: merge each mirrored body with what it touches (SolidWorks'
  // default); off keeps it a separate body.
  bool merge = 4;
}

message MirrorFeaturesResponse {
  // Feature-tree name of the new feature, e.g. "Mirror1".
  string feature_name = 1;
  // What was mirrored, e.g. "Boss-Extrude1, Cut-Extrude1" or "2 bodies".
  string mirrored = 2;
  // The plane, e.g. "Right Plane", "face".
  string plane = 3;
  // Solid bodies in the part afterwards.
  int32 body_count = 4;
}

message MirrorSketchEntitiesRequest {
  // E.g. "Sketch1". Empty: the sketch the items belong to.
  string sketch_name = 1;
  // Segments and/or points to mirror, all in that sketch; at least one.
  repeated SketchItemRef items = 2;
  // The line (or centerline) of that sketch to mirror about.
  SketchItemRef axis = 3;
}

message MirrorSketchEntitiesResponse {
  string sketch_name = 1;
  // The new segments, then (when points were mirrored) the new points that
  // aren't end or center points of segments.
  repeated SketchItem items = 2;
  SketchContours contours = 3;
  SketchState state = 4;
  // Features whose rebuild error is new or different since the mirror.
  repeated FeatureProblem new_errors = 5;
  // Mirrored lines that SolidWorks extended across the axis instead of
  // copying (a line ending on the axis at a right angle), as they are now.
  repeated SketchItem extended = 6;
}

// One direction of a linear feature pattern.
message PatternDirection {
  // A straight edge, a sketch line, a reference axis, a planar face (along
  // its normal) or a plane (along its normal), as in MirrorFeaturesRequest.
  GeometryRef direction = 1;
  // Instances along it, the original included; at least 2.
  int32 count = 2;
  // From one instance to the next, meters, > 0.
  double spacing = 3;
  // The other way along the direction.
  bool reverse = 4;
}

message LinearFeaturePattern {
  PatternDirection direction1 = 1;
  // Optional: a second direction, for a grid.
  PatternDirection direction2 = 2;
}

message CircularFeaturePattern {
  // An axis, a straight or circular edge, a sketch line, or a cylindrical or
  // conical face (its axis).
  GeometryRef axis = 1;
  // Instances, the original included; at least 2.
  int32 count = 2;
  // Radians: the total angle the instances are spread evenly over when
  // equal_spacing (2π = all the way round), else the angle between
  // neighbouring instances.
  double angle = 3;
  bool equal_spacing = 4;
  // The other way round the axis.
  bool reverse = 5;
}

message PatternFeaturesRequest {
  // Features to pattern. Not with `bodies`.
  repeated FeatureTarget features = 1;
  // Whole bodies to pattern, by persist_id from InspectModel. Not with
  // `features`.
  repeated bytes bodies = 2;
  oneof pattern {
    LinearFeaturePattern linear = 3;
    CircularFeaturePattern circular = 4;
  }
}

message PatternFeaturesResponse {
  // Feature-tree name of the new feature, e.g. "LPattern1", "CirPattern1".
  string feature_name = 1;
  // What was patterned, e.g. "Cut-Extrude1" or "1 body".
  string patterned = 2;
  // The direction(s) or axis, e.g. "edge", "Axis1", "Right Plane".
  string direction1 = 3;
  string direction2 = 4;
  // Solid bodies in the part afterwards.
  int32 body_count = 5;
}

message LinearSketchPattern {
  // Instances along the first direction, the originals included; >= 2
  // unless count2 is.
  int32 count = 1;
  // From one instance to the next, meters, > 0.
  double spacing = 2;
  // The first direction, radians counterclockwise from the sketch x axis.
  double angle = 3;
  // Rows along the second direction; 1 (or 0) for none.
  int32 count2 = 4;
  double spacing2 = 5;
  // The second direction, radians counterclockwise from the sketch x axis.
  double angle2 = 6;
}

message CircularSketchPattern {
  // The point to pattern round, sketch coordinates, meters (z unused).
  Vec3 center = 1;
  // Instances, the originals included; at least 2.
  int32 count = 2;
  // Angle between neighbouring instances, radians, counterclockwise in the
  // sketch (negative: clockwise); not 0.
  double spacing = 3;
}

message PatternSketchEntitiesRequest {
  // E.g. "Sketch1". Empty: the sketch the items belong to.
  string sketch_name = 1;
  // Segments and/or points to copy, all in that sketch; at least one.
  repeated SketchItemRef items = 2;
  oneof pattern {
    LinearSketchPattern linear = 3;
    CircularSketchPattern circular = 4;
  }
}

message PatternSketchEntitiesResponse {
  string sketch_name = 1;
  // The new segments, then (when points were patterned) the new points that
  // aren't end or center points of segments.
  repeated SketchItem items = 2;
  SketchContours contours = 3;
  SketchState state = 4;
  // Features whose rebuild error is new or different since the pattern.
  repeated FeatureProblem new_errors = 5;
}

// ---------------------------------------------------------------------------
// InspectModel

message InspectModelRequest {
  // Which entity kinds to return; any combination.
  bool include_features = 1;
  bool include_bodies = 2;
  bool include_faces = 3;
  bool include_edges = 4;

  // Restrict faces/edges to one entity: a body, a feature (the faces it
  // created) or a face (edges only). At most one of these may be set; with
  // neither, faces/edges cover every body in the part.
  //
  // Assemblies: scope_persist_id may also be a component, which narrows
  // features, bodies, faces and edges to that component (features: the
  // component's own feature tree, e.g. its reference planes). Without a
  // component scope, features are the assembly's own (planes, ...; not its
  // components or mates, which have their own lists) and bodies/faces/
  // edges cover every (unsuppressed) component -- except that bodies
  // aren't listed alongside include_components, which already says where
  // each component is. scope_feature_name isn't supported in assemblies
  // (feature names repeat across components).
  bytes scope_persist_id = 5;
  string scope_feature_name = 6;

  // Assemblies only (ignored for parts): list every component / every mate.
  bool include_components = 7;
  bool include_mates = 8;
}

message InspectModelResponse {
  Document document = 1;
  repeated FeatureInfo features = 2;
  repeated BodyInfo bodies = 3;
  repeated FaceInfo faces = 4;
  repeated EdgeInfo edges = 5;
  // Set when faces or edges were cut off at the add-in's safety limit;
  // narrow the scope to see the rest.
  bool truncated = 6;
  // Assemblies: with include_components, every component; otherwise (at
  // least) the components the returned features, bodies, faces and edges
  // belong to, so their geometry can be placed in assembly space.
  repeated ComponentInfo components = 7;
  // Assemblies, with include_mates.
  repeated MateInfo mates = 8;
}

// ---------------------------------------------------------------------------
// Assemblies
//
// Geometry read from a component's entities (faces, edges, bodies, their
// tessellation) is in that component's own coordinate system unless
// `local_geometry` says otherwise; ComponentInfo carries the placement that
// maps it into the assembly. Everything else (component boxes, mate
// values) is in assembly space.

// swComponentSuppressionState_e, simplified.
enum ComponentState {
  COMPONENT_STATE_UNSPECIFIED = 0;
  COMPONENT_STATE_RESOLVED = 1;
  COMPONENT_STATE_LIGHTWEIGHT = 2;  // geometry not loaded; faces/bodies may be missing
  COMPONENT_STATE_SUPPRESSED = 3;
}

message ComponentInfo {
  bytes persist_id = 1;
  // IComponent2::Name2, e.g. "bracket-1"; inside a subassembly SolidWorks
  // prefixes the parent's name, e.g. "sub-1/bracket-1".
  string name = 2;
  string file = 3;           // full path of the part/assembly file
  string configuration = 4;  // referenced configuration
  bool fixed = 5;            // fixed in place (can't move), vs floating
  ComponentState state = 6;
  bool hidden = 7;
  bool subassembly = 8;      // has components of its own
  bytes parent_persist_id = 9;  // the subassembly it's in; empty at top level

  // Placement in the assembly: where the component's own origin and unit
  // axes are, in assembly space (IComponent2::Transform2). A point p in
  // component coordinates is at origin + p.x*x_axis + p.y*y_axis + p.z*z_axis.
  Vec3 origin = 10;
  Vec3 x_axis = 11;
  Vec3 y_axis = 12;
  Vec3 z_axis = 13;
  // Whether the component's entity geometry (faces, edges, bodies, mesh)
  // comes back in component coordinates and needs the placement applied.
  // Determined by comparing the bodies' boxes against IComponent2::GetBox.
  bool local_geometry = 14;
  // Assembly space. Unset if SolidWorks can't report it.
  Box3 box = 15;
}

// swMateType_e, the kinds AddMate supports; anything else reads as OTHER.
enum MateType {
  MATE_TYPE_UNSPECIFIED = 0;
  MATE_TYPE_COINCIDENT = 1;
  MATE_TYPE_CONCENTRIC = 2;
  MATE_TYPE_PERPENDICULAR = 3;
  MATE_TYPE_PARALLEL = 4;
  MATE_TYPE_TANGENT = 5;
  MATE_TYPE_DISTANCE = 6;
  MATE_TYPE_ANGLE = 7;
  MATE_TYPE_LOCK = 8;
  MATE_TYPE_OTHER = 9;  // gear, width, slot, ... (see type_name)
}

// swMateAlign_e.
enum MateAlignment {
  MATE_ALIGNMENT_UNSPECIFIED = 0;  // requests: CLOSEST
  MATE_ALIGNMENT_ALIGNED = 1;      // normals / axes point the same way
  MATE_ALIGNMENT_ANTI_ALIGNED = 2; // opposite ways (e.g. face against face)
  MATE_ALIGNMENT_CLOSEST = 3;      // whichever is nearer the current position
}

message MateInfo {
  bytes persist_id = 1;  // the mate feature
  string name = 2;       // e.g. "Coincident1"
  MateType type = 3;
  string type_name = 4;  // IFeature::GetTypeName2, e.g. "MateCoincident"
  MateAlignment alignment = 5;
  bool flipped = 6;
  // The components the mate ties together (empty persist id / name for
  // the assembly's own planes etc.).
  repeated bytes component_persist_ids = 7;
  repeated string component_names = 8;
  // DISTANCE / ANGLE mates: the dimension's full name ("D1@Distance1",
  // for SetDimensionValue) and value (meters / radians).
  DimensionInfo dimension = 9;
  bool suppressed = 10;
  // swFeatureError_e (0 = fine), e.g. 46 = over-defined.
  int32 error_code = 11;
  bool error_is_warning = 12;
}

message AddMateRequest {
  MateType type = 1;  // anything but UNSPECIFIED / OTHER
  // Exactly two persist ids from InspectModel on this assembly: faces or
  // edges of components, reference plane / axis / point features (of a
  // component or the assembly itself), or -- for LOCK, and only for it --
  // two components. They must be on different components.
  repeated bytes entity_persist_ids = 2;
  MateAlignment alignment = 3;
  // DISTANCE / ANGLE: measure to the other side.
  bool flip = 4;
  double distance = 5;     // DISTANCE only: meters, >= 0
  double angle = 6;        // ANGLE only: radians, 0..pi
  bool lock_rotation = 7;  // CONCENTRIC only: also stop rotation about the axis
}

message AddMateResponse {
  MateInfo mate = 1;
  // The mated components, placed where the solve left them.
  repeated ComponentInfo components = 2;
}

// Where a new component goes: its own origin and unit axes in assembly
// space, like ComponentInfo's placement. The axes must be unit length,
// perpendicular and right-handed (z = x cross y); the MCP server works
// them out.
message ComponentPlacement {
  Vec3 origin = 1;  // meters
  Vec3 x_axis = 2;
  Vec3 y_axis = 3;
  Vec3 z_axis = 4;
}

message InsertComponentsRequest {
  oneof source {
    string path = 1;                // absolute path of a .SLDPRT / .SLDASM
    bytes copy_of_persist_id = 2;   // a component of this assembly
  }
  // Empty: the file's active configuration (copy_of: the component's).
  string configuration = 3;
  repeated ComponentPlacement placements = 4;  // one component each; at least one
  // Fix the new components in place. Unset: fix the first one if the
  // assembly had no components yet (as the UI's Begin Assembly does), the
  // others float.
  optional bool fixed = 5;
}

message InsertComponentsResponse {
  // The new components, in placement order.
  repeated ComponentInfo components = 1;
}

// A persist_id is SolidWorks' persistent reference for an entity
// (IModelDocExtension::GetPersistReference3): opaque bytes that keep
// identifying the same entity across rebuilds and later edits, for as long
// as the entity exists in this document.

message FeatureInfo {
  bytes persist_id = 1;
  string name = 2;       // as shown in the feature tree
  string type_name = 3;  // IFeature::GetTypeName2, e.g. "ProfileFeature" (sketch), "Extrusion", "Cut", "RefPlane"
  bool suppressed = 4;
  repeated string parents = 5;   // names of features this one depends on
  repeated string children = 6;  // names of features that depend on this one
  // Assemblies: the component the feature is in (empty: the assembly's own).
  bytes component_persist_id = 7;
  // swFeatureError_e as of the last rebuild (0 = fine, e.g. 13 = a fillet
  // whose edges are gone), and whether SolidWorks only warns about it.
  int32 error_code = 8;
  bool error_is_warning = 9;
  // Reference planes, axes, points and coordinate systems of the document
  // itself (not of components): where they are.
  ReferenceGeometry reference = 10;
}

message BodyInfo {
  bytes persist_id = 1;
  string name = 2;
  bool solid = 3;  // false for surface (sheet) bodies
  Box3 box = 4;
  // Unset if SolidWorks can't compute mass properties for the body.
  MassProperties mass = 5;
  int32 face_count = 6;
  int32 edge_count = 7;
  // Assemblies: the component the body is in; `box` and `mass` are then in
  // its coordinates (see ComponentInfo).
  bytes component_persist_id = 8;
}

message MassProperties {
  double volume = 1;        // m^3
  double surface_area = 2;  // m^2
  Vec3 center_of_mass = 3;  // the centroid (uniform density)
}

enum SurfaceType {
  SURFACE_TYPE_UNSPECIFIED = 0;
  SURFACE_TYPE_PLANE = 1;
  SURFACE_TYPE_CYLINDER = 2;
  SURFACE_TYPE_CONE = 3;
  SURFACE_TYPE_SPHERE = 4;
  SURFACE_TYPE_TORUS = 5;
  SURFACE_TYPE_BSPLINE = 6;
  SURFACE_TYPE_BLEND = 7;
  SURFACE_TYPE_OFFSET = 8;
  SURFACE_TYPE_EXTRUSION = 9;
  SURFACE_TYPE_REVOLUTION = 10;
}

message FaceInfo {
  bytes persist_id = 1;
  bytes body_persist_id = 2;
  string feature_name = 3;  // the feature that created the face
  SurfaceType surface_type = 4;
  double area = 5;          // m^2
  Box3 box = 6;
  int32 edge_count = 7;
  // True when the face's outward direction is opposite to its underlying
  // surface's own normal (IFace2::FaceInSurfaceSense). SolidWorks doesn't
  // orient surface normals consistently -- a cut hole's cylinder can point
  // either way -- so this alone can't tell a hole from a boss; use
  // sample_point / sample_normal for that.
  bool reversed = 8;

  // Surface parameters; which ones are set depends on surface_type:
  //   PLANE:    normal (outward, unit), origin (a point on the plane)
  //   CYLINDER: origin (on the axis), axis, radius
  //   CONE:     origin (on the axis), axis, radius, half_angle (radians)
  //   SPHERE:   origin (center), radius
  //   TORUS:    origin (center), axis, radius (major), minor_radius
  Vec3 normal = 9;
  Vec3 origin = 10;
  Vec3 axis = 11;
  double radius = 12;
  double minor_radius = 13;
  double half_angle = 14;

  // Non-planar faces: a point on the face and the face's outward unit normal
  // there (pointing out of the material), from SolidWorks' display
  // tessellation. Unset if the face has no tessellation.
  Vec3 sample_point = 15;
  Vec3 sample_normal = 16;

  // Assemblies: the component the face is in; all of the above is then in
  // its coordinates (see ComponentInfo).
  bytes component_persist_id = 17;
}

enum CurveType {
  CURVE_TYPE_UNSPECIFIED = 0;
  CURVE_TYPE_LINE = 1;
  CURVE_TYPE_CIRCLE = 2;
  CURVE_TYPE_ELLIPSE = 3;
  CURVE_TYPE_INTERSECTION = 4;
  CURVE_TYPE_BSPLINE = 5;
  CURVE_TYPE_SPCURVE = 6;
  CURVE_TYPE_CONSTPARAM = 7;
  CURVE_TYPE_TRIMMED = 8;
}

message EdgeInfo {
  bytes persist_id = 1;
  bytes body_persist_id = 2;
  CurveType curve_type = 3;
  double length = 4;  // m
  Vec3 start = 5;
  Vec3 end = 6;       // equals start for a closed edge such as a full circle
  // The one or two faces meeting at this edge.
  repeated bytes face_persist_ids = 7;
  // CIRCLE only.
  Vec3 center = 8;
  Vec3 axis = 9;
  double radius = 10;
  // Assemblies: as FaceInfo.component_persist_id.
  bytes component_persist_id = 11;
  // The vertices at `start` and `end`; unset for a closed edge (a full
  // circle has none).
  bytes start_vertex_persist_id = 12;
  bytes end_vertex_persist_id = 13;
}

// ---------------------------------------------------------------------------
// GetMesh
//
// Coordinates are packed as floats (x, y, z, x, y, z, ...) in meters, model
// space: single precision is plenty for pictures and halves the message.

message GetMeshRequest {
  // Also return the edges as polylines.
  bool include_edges = 1;
}

message GetMeshResponse {
  Document document = 1;
  repeated FaceMesh faces = 2;
  repeated EdgePolyline edges = 3;
  // Set when faces or edges were cut off at the add-in's safety limit.
  bool truncated = 4;
  // Assemblies: the components the faces/edges belong to, with their
  // placements (component coordinates -> assembly).
  repeated ComponentInfo components = 5;
}

message FaceMesh {
  // Same persist IDs InspectModel returns, so the two can be matched up.
  bytes persist_id = 1;
  bytes body_persist_id = 2;
  bytes feature_persist_id = 3;  // the feature that created the face
  string feature_name = 4;
  // Triangles: 9 floats (3 vertices) each, from IFace2::GetTessTriangles.
  repeated float triangles = 5;
  // One unit normal per vertex, pointing out of the material, in the same
  // order as `triangles` (IFace2::GetTessNorms). May be empty.
  repeated float normals = 6;
  // Assemblies: the component the face is in; coordinates are then in its
  // coordinate system if that component's local_geometry is set.
  bytes component_persist_id = 7;
}

message EdgePolyline {
  bytes persist_id = 1;
  bytes body_persist_id = 2;
  // Points along the edge, start to end (at least 2).
  repeated float points = 3;
  // Assemblies: as FaceMesh.component_persist_id.
  bytes component_persist_id = 4;
}

// ---------------------------------------------------------------------------
// Sketch dimensions and relations
//
// Sketch coordinates are the sketch's own 2D axes (see SketchFrame), meters;
// angles are radians.

// One entity inside a 2D sketch: SolidWorks' sketch entity ID
// (ISketchSegment::GetID / ISketchPoint::GetID, two numbers that stay the
// same for as long as the entity exists) plus the sketch it belongs to.
// Segments are numbered per type (a line and a circle of one sketch can
// both be [0, 1]), so a segment's ref includes its type. Treat as opaque.
message SketchItemRef {
  bytes sketch_persist_id = 1;  // the sketch feature's persist_id
  bool point = 2;               // a sketch point rather than a segment
  int64 id0 = 3;
  int64 id1 = 4;
  int32 segment_type = 5;       // segments: ISketchSegment::GetType (swSketchSegments_e)
}

enum SketchItemType {
  SKETCH_ITEM_TYPE_UNSPECIFIED = 0;
  SKETCH_ITEM_TYPE_POINT = 1;
  SKETCH_ITEM_TYPE_LINE = 2;
  SKETCH_ITEM_TYPE_ARC = 3;
  SKETCH_ITEM_TYPE_CIRCLE = 4;
  SKETCH_ITEM_TYPE_SPLINE = 5;
  SKETCH_ITEM_TYPE_ELLIPSE = 6;
  SKETCH_ITEM_TYPE_OTHER = 7;   // parabola, text, ...
}

// swConstrainedStatus_e.
enum DefinitionStatus {
  DEFINITION_STATUS_UNSPECIFIED = 0;
  DEFINITION_STATUS_UNDER = 1;        // can still move
  DEFINITION_STATUS_FULLY = 2;
  DEFINITION_STATUS_OVER = 3;         // conflicting dimensions/relations
  DEFINITION_STATUS_NO_SOLUTION = 4;
  DEFINITION_STATUS_INVALID = 5;      // solved, but into invalid geometry
  DEFINITION_STATUS_NOT_SOLVED = 6;   // automatic solve is off
}

// A segment or point of a sketch. Geometry in sketch coordinates; which
// fields are set depends on `type`:
//   POINT:          position
//   LINE:           start, end (+ start_point, end_point), length
//   ARC:            start, end, center (+ the three points), radius, length
//   CIRCLE:         center (+ center_point), radius, length
//   SPLINE/ELLIPSE: start, end (+ points) when SolidWorks reports them, length
message SketchItem {
  SketchItemRef ref = 1;
  SketchItemType type = 2;
  string name = 3;  // SolidWorks' own name, e.g. "Line3" (segments only)
  bool construction = 4;
  DefinitionStatus status = 5;
  Vec3 position = 6;
  Vec3 start = 7;
  Vec3 end = 8;
  Vec3 center = 9;
  double radius = 10;
  double length = 11;
  SketchItemRef start_point = 12;
  SketchItemRef end_point = 13;
  SketchItemRef center_point = 14;
}

// How defined a sketch is, and what can still move.
message SketchState {
  DefinitionStatus status = 1;
  // Entities that aren't fully defined (or are over defined), up to a cap.
  repeated SketchItem not_fully_defined = 2;
  // How many there are in all (may exceed the list).
  int32 not_fully_defined_count = 3;
}

enum DimensionType {
  DIMENSION_TYPE_UNSPECIFIED = 0;
  DIMENSION_TYPE_LINEAR = 1;
  DIMENSION_TYPE_ANGULAR = 2;  // value in radians
  DIMENSION_TYPE_RADIUS = 3;
  DIMENSION_TYPE_DIAMETER = 4;
  DIMENSION_TYPE_ARC_LENGTH = 5;
  DIMENSION_TYPE_ORDINATE = 6;
  DIMENSION_TYPE_OTHER = 7;
}

message DimensionInfo {
  string name = 1;  // full name, e.g. "D1@Sketch1"
  DimensionType type = 2;
  double value = 3;  // meters, or radians for ANGULAR
  // A driven (reference) dimension only measures; it doesn't define anything.
  bool driven = 4;
}

// A sketch relation. Entities outside the sketch (the origin, model
// edges, ...) are only counted.
message RelationInfo {
  int32 constraint_type = 1;  // swConstraintType_e
  repeated SketchItemRef items = 2;
  int32 external_count = 3;
}

message InspectSketchRequest {
  // E.g. "Sketch1". Empty means the last sketch in the feature tree.
  string sketch_name = 1;
}

message InspectSketchResponse {
  string sketch_name = 1;
  SketchFrame frame = 2;
  DefinitionStatus status = 3;
  // Segments first, then points.
  repeated SketchItem items = 4;
  repeated DimensionInfo dimensions = 5;
  repeated RelationInfo relations = 6;
  SketchContours contours = 7;
  // Set when items were cut off at the add-in's safety limit.
  bool truncated = 8;
}

// Something a dimension or relation attaches to.
message SketchRef {
  oneof target {
    SketchItemRef item = 1;
    // The sketch origin (the part origin, seen from the sketch).
    bool origin = 2;
    // Model geometry outside the sketch: an edge or face persist_id from
    // InspectModel.
    bytes model_persist_id = 3;
  }
}

enum DimensionKind {
  DIMENSION_KIND_UNSPECIFIED = 0;
  DIMENSION_KIND_LENGTH = 1;      // 1 line: its length (aligned)
  DIMENSION_KIND_DISTANCE = 2;    // 2 refs: shortest/aligned distance
  DIMENSION_KIND_HORIZONTAL = 3;  // 1 line or 2 refs: along sketch X
  DIMENSION_KIND_VERTICAL = 4;    // 1 line or 2 refs: along sketch Y
  DIMENSION_KIND_DIAMETER = 5;    // 1 circle or arc
  DIMENSION_KIND_RADIUS = 6;      // 1 circle or arc
  DIMENSION_KIND_ANGLE = 7;       // 2 lines
}

message SketchDimension {
  DimensionKind kind = 1;
  repeated SketchRef refs = 2;
  // Drive the dimension to this value (meters, radians for ANGLE). Unset
  // keeps the geometry's current value.
  optional double value = 3;
}

message AddSketchDimensionsRequest {
  // Empty means the sketch the first sketch item ref belongs to.
  string sketch_name = 1;
  repeated SketchDimension dimensions = 2;  // at least one
}

message AddSketchDimensionsResponse {
  string sketch_name = 1;
  // One per request dimension, with the value after solving.
  repeated DimensionInfo dimensions = 2;
  SketchState state = 3;
}

enum RelationKind {
  RELATION_KIND_UNSPECIFIED = 0;
  RELATION_KIND_HORIZONTAL = 1;     // lines, or 2 points
  RELATION_KIND_VERTICAL = 2;       // lines, or 2 points
  RELATION_KIND_COINCIDENT = 3;     // point + point/line/arc
  RELATION_KIND_MIDPOINT = 4;       // point + line
  RELATION_KIND_COLLINEAR = 5;      // lines
  RELATION_KIND_PARALLEL = 6;       // lines
  RELATION_KIND_PERPENDICULAR = 7;  // 2 lines
  RELATION_KIND_TANGENT = 8;        // arc/circle/spline + line/arc
  RELATION_KIND_CONCENTRIC = 9;     // arcs/circles/points
  RELATION_KIND_CORADIAL = 10;      // 2 arcs/circles
  RELATION_KIND_EQUAL = 11;         // lines, or arcs/circles
  RELATION_KIND_FIXED = 12;         // anything
  RELATION_KIND_SYMMETRIC = 13;     // 2 entities + a centerline, in that order
  RELATION_KIND_MERGE = 14;         // 2 points
}

message SketchRelation {
  RelationKind kind = 1;
  repeated SketchRef refs = 2;
}

message AddSketchRelationsRequest {
  // Empty means the sketch the first sketch item ref belongs to.
  string sketch_name = 1;
  repeated SketchRelation relations = 2;  // at least one
}

message AddSketchRelationsResponse {
  string sketch_name = 1;
  int32 added = 2;
  SketchState state = 3;
}

enum DimensionScheme {
  DIMENSION_SCHEME_UNSPECIFIED = 0;  // baseline
  DIMENSION_SCHEME_BASELINE = 1;
  DIMENSION_SCHEME_CHAIN = 2;
  DIMENSION_SCHEME_ORDINATE = 3;
}

message FullyDefineSketchRequest {
  // Empty means the last sketch in the feature tree.
  string sketch_name = 1;
  // Only add dimensions / only add relations.
  bool skip_relations = 2;
  bool skip_dimensions = 3;
  DimensionScheme scheme = 4;
  // What horizontal / vertical dimensions are measured from. Unset means
  // the sketch origin.
  SketchRef horizontal_datum = 5;
  SketchRef vertical_datum = 6;
}

message FullyDefineSketchResponse {
  string sketch_name = 1;
  repeated DimensionInfo added_dimensions = 2;
  int32 added_relations = 3;
  SketchState state = 4;
}

message SetDimensionValueRequest {
  string name = 1;  // e.g. "D1@Sketch1"
  oneof value {
    double length = 2;  // meters
    double angle = 3;   // radians
  }
}

message SetDimensionValueResponse {
  DimensionInfo dimension = 1;
}

message SetDimensionToleranceRequest {
  // Full name, as InspectSketch / InspectAnnotations / InspectDrawing
  // report it.
  string name = 1;
  // swTolType_e: 0 none, 1 basic, 2 bilateral, 3 limit, 4 symmetric,
  // 5 min, 6 max, 7 fit, 8 fit with tolerance, 9 fit tolerance only.
  int32 tolerance_type = 2;
  // Bilateral, limit, symmetric: the upper (max) and lower (min) deviation
  // from the nominal value (IDimensionTolerance::SetValues2), meters, or
  // radians with `angle`. Symmetric: lower = -upper.
  double upper = 3;
  double lower = 4;
  // The deviations are angles; the dimension has to be an angle (and
  // without it, a length).
  bool angle = 5;
  // Fit types: ISO fit classes, e.g. "H7" / "g6" (either may be empty).
  string hole_fit = 6;
  string shaft_fit = 7;
  // Decimal places of the nominal value / of the tolerance values. Unset:
  // unchanged. -2: the document's setting; tolerance -3: same as the value.
  optional int32 value_precision = 8;
  optional int32 tolerance_precision = 9;
}

message SetDimensionToleranceResponse {
  // The dimension afterwards (name, value, tolerance, owner, ...).
  AnnotationDimension dimension = 1;
  // Drawings: the view the dimension is in.
  string view_name = 2;
  // Decimal places shown now, -1 if SolidWorks didn't say (no display
  // dimension found).
  int32 value_precision = 3;
  int32 tolerance_precision = 4;
  // Drawings: other views showing the same (model) dimension, which show
  // the new tolerance too.
  repeated string other_views = 5;
}

// ---------------------------------------------------------------------------
// HoleWizard

// swWzdGeneralHoleTypes_e, the kinds this RPC supports.
enum HoleKind {
  HOLE_KIND_UNSPECIFIED = 0;
  HOLE_KIND_HOLE = 1;         // plain drilled / clearance hole (swWzdHole)
  HOLE_KIND_COUNTERBORE = 2;  // swWzdCounterBore
  HOLE_KIND_COUNTERSINK = 3;  // swWzdCounterSink
  HOLE_KIND_TAP = 4;          // straight tapped hole (swWzdTap)
}

// swWzdHoleScrewClearanceTypes_e. Clearance for the screw; only used when
// the diameter comes from the standard.
enum ScrewFit {
  SCREW_FIT_UNSPECIFIED = 0;  // SolidWorks' default (normal)
  SCREW_FIT_CLOSE = 1;
  SCREW_FIT_NORMAL = 2;
  SCREW_FIT_LOOSE = 3;
}

message HoleWizardRequest {
  // Where the holes go: either `sketch_name`, or `face_persist_id` (with
  // optional `locations`).
  //
  // A 2D sketch, e.g. "Sketch3", holding the hole centers as sketch points
  // (construction geometry is allowed and ignored; its end and center
  // points aren't holes). It must not be used by another feature yet; the
  // hole feature absorbs it.
  string sketch_name = 18;
  // The planar face the holes start on (persist_id from InspectModel). The
  // holes go into the material, against the face's outward normal, unless
  // `reverse_direction`.
  bytes face_persist_id = 1;
  // Hole centers in model space, meters, each projected onto the face's
  // plane; every one must land on the face. Empty means one hole at the
  // center of the face's bounding box. At most 500.
  repeated Vec3 locations = 2;

  HoleKind kind = 3;
  // swWzdHoleStandards_e, e.g. 8 = ISO.
  int32 standard = 4;
  // swWzdHoleStandardFastenerTypes_e, e.g. 139 = ISO socket head cap screw.
  // Must belong to `standard` and suit `kind`.
  int32 fastener_type = 5;
  // A size from the standard's table for that fastener type, exactly as the
  // Hole Wizard lists it, e.g. "M5", "#10", "1/4".
  string size = 6;

  // Through the whole part; otherwise blind to `depth`.
  bool through_all = 7;
  // Meters, > 0 unless through_all. For tapped holes, the drilled depth.
  double depth = 8;
  bool reverse_direction = 9;
  // Clearance holes, counterbores and countersinks.
  ScrewFit fit = 10;

  // Overrides of the standard's values; unset keeps the standard's.
  // Meters, angles in radians.
  optional double diameter = 11;              // the hole itself
  optional double counterbore_diameter = 12;  // counterbores only
  optional double counterbore_depth = 13;     // counterbores only
  optional double countersink_diameter = 14;  // countersinks only
  optional double countersink_angle = 15;     // countersinks only, included angle
  optional double thread_depth = 16;          // tapped holes only
  // Tapped holes only: add a cosmetic thread (with its callout).
  bool cosmetic_thread = 17;
}

// What SolidWorks built, read back from the feature
// (IWizardHoleFeatureData2). Values SolidWorks doesn't report, or that don't
// apply to the hole's kind, are 0 / empty. Meters, angles in radians.
message HoleSpec {
  string size = 1;
  int32 standard = 2;       // swWzdHoleStandards_e
  int32 fastener_type = 3;  // swWzdHoleStandardFastenerTypes_e
  bool through_all = 4;
  double diameter = 5;      // the (clearance / drilled) hole
  double depth = 6;         // unset for through all
  double counterbore_diameter = 7;
  double counterbore_depth = 8;
  double countersink_diameter = 9;
  double countersink_angle = 10;
  double tap_drill_diameter = 11;
  double thread_diameter = 12;
  double thread_depth = 13;
}

message HoleWizardResponse {
  // Feature-tree name, e.g. "CBORE for M5 Socket Head Cap Screw1".
  string feature_name = 1;
  // The feature's placement sketch, which holds the hole centers: the
  // request's sketch_name, or a new one.
  string sketch_name = 2;
  // One point per hole, with IDs for AddSketchDimensions etc. Positions in
  // the placement sketch's coordinates.
  repeated SketchItem centers = 3;
  // The same centers in model space, in the same order.
  repeated Vec3 centers_model = 4;
  // The placement sketch's axes.
  SketchFrame frame = 5;
  HoleSpec spec = 6;
}

// ---------------------------------------------------------------------------
// InspectAnnotations (PMI / MBD)
//
// Lengths in meters, angles in radians, as everywhere else. Enum-valued
// fields carry SolidWorks' raw values (named in the comments); the MCP
// server turns them into words.

message InspectAnnotationsRequest {}

message InspectAnnotationsResponse {
  Document document = 1;
  repeated AnnotationInfo annotations = 2;
  // Assemblies: the components the attached entities belong to.
  repeated ComponentInfo components = 3;
  // Set when annotations were cut off at the add-in's safety limit.
  bool truncated = 4;
}

// What kind of thing an annotation is attached to.
enum AttachedKind {
  ATTACHED_KIND_UNSPECIFIED = 0;
  ATTACHED_KIND_FACE = 1;
  ATTACHED_KIND_EDGE = 2;
  ATTACHED_KIND_VERTEX = 3;
  ATTACHED_KIND_FEATURE = 4;  // reference plane / axis / point, sketch, ...
  ATTACHED_KIND_OTHER = 5;    // sketch entity, silhouette, ...
}

message AttachedEntity {
  AttachedKind kind = 1;
  bytes persist_id = 2;  // empty if SolidWorks can't reference it
  // Assemblies: the component the entity is in (empty: the assembly's own).
  bytes component_persist_id = 3;
}

message AnnotationInfo {
  // IAnnotation::GetName, e.g. "DatumTag1", "Gtol1", "RD1@Annotations".
  string name = 1;
  // swAnnotationType_e: 1 cosmetic thread, 2 datum tag, 3 datum target,
  // 4 dimension, 5 geometric tolerance, 6 note, 7 surface finish, 8 weld
  // symbol, 9 custom symbol, 10 dowel pin, 13 center mark, 16 datum origin,
  // 19 imported PMI, ...
  int32 type = 2;
  // Created by DimXpert, which the SolidWorks UI calls "MBD Dimension".
  bool dimxpert = 3;
  // DimXpert's own name for the annotation (IAnnotation::GetDimXpertName).
  string dimxpert_name = 4;
  // The DimXpert feature the annotation is applied to, e.g. "Plane1",
  // "Simple Hole1", "Hole Pattern1" (IDimXpertFeature::Name).
  string dimxpert_feature = 5;
  // swAnnotationVisibilityState_e: 1 visible, 2 half hidden, 3 hidden.
  int32 visibility = 6;
  // Lost its references (the geometry it pointed at is gone).
  bool dangling = 7;
  // swPMIType_e, for PMI imported from a neutral file (STEP AP242):
  // 1 dimension, 2 datum, 3 geometric tolerance, 4 unknown. 0 otherwise.
  int32 pmi_type = 8;
  // Where the annotation's text sits, model (or assembly) space.
  Vec3 position = 9;
  // What it's attached to. For DimXpert annotations that SolidWorks doesn't
  // report attachments for, the DimXpert feature's faces.
  repeated AttachedEntity attached = 10;
  // The text SolidWorks displays, as it reports it: notes, datum letters,
  // the pieces of a feature control frame, a dimension's prefix/suffix,
  // ... Symbols appear as SolidWorks codes, e.g. "<MOD-DIAM>".
  repeated string text = 11;

  // Detail for the common PMI types; at most one is set.
  AnnotationDimension dimension = 12;  // type 4
  AnnotationGtol gtol = 13;            // type 5
  string datum_label = 14;             // type 2: the datum letter, e.g. "A"
}

message AnnotationDimension {
  // Full name ("D1@Sketch1", "RD1@Annotations", ...), measurement type,
  // nominal value, driven. Not set if SolidWorks gives no IDimension.
  DimensionInfo dimension = 1;
  // swTolType_e: 0 none, 1 basic, 2 bilateral, 3 limit, 4 symmetric,
  // 5 min, 6 max, 7 fit, 8 fit with tolerance, 9 fit tolerance only,
  // 10 block, 11 general.
  int32 tolerance_type = 2;
  // IDimensionTolerance::GetMaxValue / GetMinValue: the upper and lower
  // deviation from the nominal value, meters (radians for angles).
  double tolerance_max = 3;
  double tolerance_min = 4;
  // Fit classes, e.g. "H7" / "g6", for the fit tolerance types.
  string hole_fit = 5;
  string shaft_fit = 6;
  // A reference dimension (shown in parentheses, not toleranced).
  bool reference = 7;
  // A hole callout (Hole Wizard / DimXpert hole).
  bool hole_callout = 8;
  // Inspection dimension (shown in an oval).
  bool inspection = 9;
  // The feature that owns the dimension ("Sketch1", "Boss-Extrude1", ...),
  // empty for dimensions that only annotate (DimXpert, reference).
  string owner_feature = 10;
  string owner_feature_type = 11;  // IFeature::GetTypeName2
  // Text added around the value (IDisplayDimension::GetText), e.g. a
  // prefix "4X " on a pattern of holes.
  string prefix = 12;
  string suffix = 13;
  string callout_above = 14;
  string callout_below = 15;
}

// One row of a feature control frame.
message GtolFrame {
  // swGtolGeomCharSymbol_e: 12 none, 13 symmetry, 14 straightness,
  // 15 flatness, 16 circularity, 17 cylindricity, 18 profile of a line,
  // 19 profile of a surface, 20 angularity, 21 perpendicularity,
  // 22 parallelism, 23 position, 24 concentricity, 25 circular runout,
  // 26 total runout, ... -1 if SolidWorks didn't report it.
  int32 symbol = 1;
  // Tolerance values as typed, e.g. "0.05".
  string tolerance1 = 2;
  string tolerance2 = 3;
  bool tolerance1_diameter = 4;  // diameter (cylindrical) tolerance zone
  bool tolerance2_diameter = 5;
  // swGtolMatCondition_e: 0 none, 1 MMC, 2 RFS, 3 LMC, ...
  int32 tolerance1_condition = 6;
  int32 tolerance2_condition = 7;
  // Primary, secondary, tertiary datum references (empty when unused),
  // e.g. "A", "B-C".
  repeated string datums = 8;
  // swGtolMatCondition_e per datum, same order.
  repeated int32 datum_conditions = 9;
}

message AnnotationGtol {
  repeated GtolFrame frames = 1;
  // A datum feature symbol shown on the frame (IGtol::GetDatumIdentifier).
  string datum_label = 2;
  bool composite = 3;
  bool all_around = 4;
  // Projected tolerance zone height, as typed.
  string projected_zone_height = 5;
  // swGtolFormatType_e: 1 = before SOLIDWORKS 2022, 2 = 2022 and later.
  int32 format = 6;
}

// ---------------------------------------------------------------------------
// Drawings: InspectDrawing, AddDrawingDimensions, InsertModelItems
//
// Sheet coordinates are meters from the sheet's lower-left corner, x to the
// right and y up. Model geometry (ViewEntity.edge, start, end) is in the
// space of the view's model, as InspectModel reports it -- for assembly
// components with local_geometry, that component's space (see
// ComponentInfo) -- and each ViewInfo says how model space maps onto the
// sheet; projecting is the MCP server's job.

message InspectDrawingRequest {
  // Views (by name, e.g. "Drawing View1") whose visible entities to list.
  // Empty: none (only sheets and views).
  repeated string entity_views = 1;
  // Also list those views' visible vertices. Edges and silhouette edges
  // are always listed.
  bool include_vertices = 2;
  // Describe every view's (and sheet's) annotations. Otherwise only their
  // types are reported.
  bool include_annotations = 3;
}

message InspectDrawingResponse {
  Document document = 1;
  repeated SheetInfo sheets = 2;
  // Set when entities or annotations were cut off at the add-in's safety
  // limit.
  bool truncated = 3;
}

message SheetInfo {
  string name = 1;  // e.g. "Sheet1"
  bool active = 2;  // the sheet SolidWorks is showing
  // swDwgPaperSizes_e: 0 A (letter) landscape, 1 A portrait, 2 B, 3 C,
  // 4 D, 5 E, 6 A4 landscape, 7 A4 portrait, 8 A3, 9 A2, 10 A1, 11 A0,
  // 12 user defined. -1 if SolidWorks didn't report it.
  int32 paper_size = 3;
  double width = 4;   // meters
  double height = 5;  // meters
  // Sheet scale numerator : denominator, e.g. 1 : 2.
  double scale_numerator = 6;
  double scale_denominator = 7;
  // First-angle projection (ISO default); otherwise third-angle (ANSI).
  bool first_angle = 8;
  string sheet_format = 9;  // the sheet format's name, if any
  repeated ViewInfo views = 10;
  // Annotations on the sheet itself rather than in a view (notes, ...):
  // swAnnotationType_e of each, and with include_annotations, each
  // described.
  repeated int32 annotation_types = 11;
  repeated AnnotationInfo annotations = 12;
}

enum ViewEntityKind {
  VIEW_ENTITY_KIND_UNSPECIFIED = 0;
  VIEW_ENTITY_KIND_EDGE = 1;
  VIEW_ENTITY_KIND_VERTEX = 2;
  // The outline of a curved face seen from the side, e.g. the two lines
  // of a cylinder seen side-on. Not a model edge.
  VIEW_ENTITY_KIND_SILHOUETTE = 3;
}

message ViewInfo {
  string name = 1;  // e.g. "Drawing View1"
  // swDrawingViewTypes_e: 2 section, 3 detail, 4 projected, 5 auxiliary,
  // 6 standard, 7 named (from a model view), 8 relative, 9 detached,
  // 10 alternate position.
  int32 type = 2;
  // IView::GetOrientationName, e.g. "*Front", "*Isometric"; may be empty
  // for derived views.
  string orientation = 3;
  string model_file = 4;     // full path of the part/assembly shown
  string configuration = 5;  // its configuration
  // The model's type; UNSPECIFIED if it isn't loaded.
  DocumentType model_type = 6;
  bool model_loaded = 7;
  double scale_numerator = 8;
  double scale_denominator = 9;
  bool uses_sheet_scale = 10;
  // Sheet coordinates (z = 0): the view's bounding box and position.
  Box3 outline = 11;
  Vec3 position = 12;
  // IView::ModelToViewTransform, as where the model's origin lands on the
  // sheet and what its unit axes become (sheet vectors, so their length is
  // the view's scale): model point p is at
  //   model_origin + p.x*model_x + p.y*model_y + p.z*model_z
  // whose x, y are sheet coordinates (z is depth, toward the viewer).
  // Unset if SolidWorks didn't report the transform.
  Vec3 model_origin = 13;
  Vec3 model_x = 14;
  Vec3 model_y = 15;
  Vec3 model_z = 16;
  // swDisplayMode_e: 0 wireframe, 1 hidden lines visible (greyed),
  // 2 hidden lines removed, 3 shaded, 7 shaded with edges.
  int32 display_mode = 17;
  // The view this one is projected / derived from, if any.
  string base_view = 18;
  // Assemblies: the components the entities and annotation attachments
  // belong to, with their placements.
  repeated ComponentInfo components = 19;
  // Set when this view's entities were asked for (InspectDrawingRequest.
  // entity_views); `entities` may still be empty.
  bool entities_listed = 20;
  repeated ViewEntity entities = 21;
  // swAnnotationType_e of each annotation in the view.
  repeated int32 annotation_types = 22;
  // With include_annotations: each annotation described. Persist ids of
  // attached entities are the view model's, as in ViewEntity.
  repeated AnnotationInfo annotations = 23;
}

// One thing visible in a drawing view.
message ViewEntity {
  ViewEntityKind kind = 1;
  // What identifies it within the view, for DrawingEntityRef: the entity's
  // persist id in the view's model (silhouettes: their face's), its
  // component (assemblies), and an ordinal that tells apart entities with
  // the same persist id and component (several silhouettes of one face, or
  // entities SolidWorks can't give a persist id). Treat as opaque.
  bytes persist_id = 2;
  bytes component_persist_id = 3;
  int32 ordinal = 4;
  // EDGE: as InspectModel describes it (model space).
  EdgeInfo edge = 5;
  // SILHOUETTE: its end points; VERTEX: start = the point. Model space.
  Vec3 start = 6;
  Vec3 end = 7;
}

// Names an entity of a drawing view, from InspectDrawing's ViewInfo.name
// and ViewEntity's kind / persist_id / component_persist_id / ordinal.
message DrawingEntityRef {
  string view_name = 1;
  ViewEntityKind kind = 2;
  bytes persist_id = 3;
  bytes component_persist_id = 4;
  int32 ordinal = 5;
}

message DrawingDimension {
  // In drawings, HORIZONTAL / VERTICAL are along the sheet's x / y.
  // LENGTH: 1 edge. DISTANCE: 2 entities. HORIZONTAL / VERTICAL: 1 edge or
  // 2 entities. DIAMETER / RADIUS: 1 circular edge. ANGLE: 2 straight edges.
  DimensionKind kind = 1;
  // All in the same view.
  repeated DrawingEntityRef refs = 2;
  // Where the dimension text goes, sheet coordinates (meters).
  double text_x = 3;
  double text_y = 4;
}

message AddDrawingDimensionsRequest {
  repeated DrawingDimension dimensions = 1;  // at least one
}

message DrawingDimensionResult {
  string view_name = 1;
  // The new dimension (type 4): name (e.g. "RD1@Drawing View1"), measured
  // value, text, position, attached entities.
  AnnotationInfo annotation = 2;
}

message AddDrawingDimensionsResponse {
  // One per request dimension, in order.
  repeated DrawingDimensionResult dimensions = 1;
  // Assemblies: the components attached entities belong to.
  repeated ComponentInfo components = 2;
}

message InsertModelItemsRequest {
  // Views to insert into, all on one sheet. Empty: every view of the
  // active sheet.
  repeated string view_names = 1;
  // swInsertAnnotation_e flags, e.g. 32768 = dimensions marked for drawing
  // (the Model Items default), 524288 = dimensions not marked for drawing,
  // 131072 = Hole Wizard locations, 1048576 = hole callouts, 2 = datums,
  // 32 = geometric tolerances, 64 = notes, 128 = surface finish. 0 means
  // 32768.
  int32 types = 2;
  // Also insert dimensions already shown in another view.
  bool include_duplicates = 3;
  // Also insert dimensions of features hidden in the view.
  bool include_hidden_features = 4;
}

message ViewAnnotations {
  string view_name = 1;
  repeated AnnotationInfo annotations = 2;
  repeated ComponentInfo components = 3;
}

message InsertModelItemsResponse {
  // How many annotations SolidWorks says it inserted.
  int32 inserted = 1;
  // Per view, the annotations it has now that it didn't have before.
  repeated ViewAnnotations views = 2;
}

message RenderDrawingRequest {
  // Empty: the sheet `view_name` is on, else the active sheet.
  string sheet_name = 1;
  string view_name = 3;
  // Resolution, dots per inch of the sheet, 100..300 (what SolidWorks
  // exports); 0 means 150. Lowered so the image's longer side stays within
  // max_px, but not below 100.
  int32 dpi = 2;
  int32 max_px = 4;  // 0 means 8000
}

message SheetViewOutline {
  string name = 1;
  Box3 outline = 2;  // sheet meters (z = 0)
}

message RenderDrawingResponse {
  string sheet_name = 1;
  double width = 2;   // sheet, meters
  double height = 3;
  int32 dpi = 4;       // what was asked of SolidWorks
  string format = 5;   // "png" or "jpg"
  bytes image = 6;     // the file SolidWorks wrote; covers the whole sheet
  repeated SheetViewOutline views = 7;
  string document_title = 8;
}

// ---------------------------------------------------------------------------
// Deleting

// A feature to delete: its persist_id (InspectModel's features and mates)
// or its feature-tree name.
message FeatureTarget {
  oneof target {
    bytes persist_id = 1;
    string name = 2;  // e.g. "Boss-Extrude1", "Sketch2", "Coincident3"
  }
}

// What to do with features that depend on the ones being deleted.
enum ChildFeatures {
  CHILD_FEATURES_UNSPECIFIED = 0;  // = REFUSE
  // Fail (FAILED_PRECONDITION, naming them) if there are any.
  CHILD_FEATURES_REFUSE = 1;
  // Delete them too (swDelete_Children).
  CHILD_FEATURES_DELETE = 2;
  // Leave them; they lose their references to the deleted features and
  // may fail to rebuild.
  CHILD_FEATURES_KEEP = 3;
}

message DeleteFeaturesRequest {
  repeated FeatureTarget features = 1;  // at least one
  ChildFeatures children = 2;
  // Also delete the features the deleted ones absorbed, e.g. an extrude's
  // profile sketch (swDelete_Absorbed). Off, they stay in the tree, as
  // SolidWorks' own default does.
  bool delete_absorbed = 3;
}

message FeatureRef {
  string name = 1;
  string type_name = 2;  // IFeature::GetTypeName2, e.g. "Extrusion", "ProfileFeature"
}

// A feature that fails (or warns) on rebuild.
message FeatureProblem {
  string name = 1;
  string type_name = 2;
  int32 error_code = 3;  // swFeatureError_e
  bool warning = 4;      // SolidWorks only warns; the feature still rebuilt
}

message DeleteFeaturesResponse {
  // Every feature that is gone, in tree order: the requested ones plus, with
  // children = DELETE or delete_absorbed, what went with them.
  repeated FeatureRef deleted = 1;
  // Requested features SolidWorks didn't delete (the call still succeeds if
  // it deleted any).
  repeated FeatureRef not_deleted = 2;
  // Features the deleted ones had absorbed that are still there (now
  // standalone in the tree), e.g. a deleted extrude's sketch.
  repeated FeatureRef kept_absorbed = 3;
  // Features that depended on deleted ones and are still there
  // (children = KEEP).
  repeated FeatureRef kept_children = 4;
  // Remaining features whose rebuild error is new or different since the
  // delete.
  repeated FeatureProblem new_errors = 5;
}

message DeleteSketchEntitiesRequest {
  // E.g. "Sketch1". Empty: the sketch the items belong to.
  string sketch_name = 1;
  // Segments and/or standalone points, all in that sketch; at least one.
  repeated SketchItemRef items = 2;
}

message DeleteSketchEntitiesResponse {
  string sketch_name = 1;
  // How many of the requested items are gone.
  int32 deleted = 2;
  // Requested items SolidWorks didn't delete.
  repeated SketchItemRef kept = 3;
  // End/center points that went with the deleted segments.
  int32 points_removed = 4;
  // Dimensions that went with them, e.g. "D2@Sketch1".
  repeated string dimensions_removed = 5;
  // Relations (not dimensions) that went with them.
  int32 relations_removed = 6;
  SketchState state = 7;
  SketchContours contours = 8;
  // Features whose rebuild error is new or different since the delete, e.g.
  // an extrude of the sketch whose profile is now open.
  repeated FeatureProblem new_errors = 9;
}

// ---------------------------------------------------------------------------
// Diagnosing

message DiagnoseModelRequest {
  // Report the errors as of the last rebuild instead of rebuilding first.
  bool skip_rebuild = 1;
}

enum RelationProblem {
  RELATION_PROBLEM_UNSPECIFIED = 0;
  // An entity it's attached to is gone (swDangling), e.g. a model edge
  // that a deleted feature made.
  RELATION_PROBLEM_DANGLING = 1;
  // It conflicts with others or can't be solved (swOverDefining).
  RELATION_PROBLEM_OVER_DEFINING = 2;
  // A broken external (in-context) reference (swBroken).
  RELATION_PROBLEM_BROKEN = 3;
}

// A sketch relation or dimension with a problem.
message SketchRelationProblem {
  // The worst problem SolidWorks lists it under: dangling, then broken,
  // then over-defining.
  RelationProblem problem = 1;
  int32 constraint_type = 2;  // swConstraintType_e
  // Dimensions (distance, angle, radius, diameter): the full name, e.g.
  // "D2@Sketch3".
  string dimension_name = 3;
  // Its entities that are in the sketch.
  repeated SketchItemRef items = 4;
  // swSketchRelationEntityTypes_e of each entity it was made between,
  // missing ones included, as far as SolidWorks reports them.
  repeated int32 entity_types = 5;
  // Entities outside the sketch that still exist (the origin, model edges).
  int32 external_count = 6;
  // Entities that are gone (null in the relation's entity list).
  int32 missing_count = 7;
}

message SketchDiagnosis {
  DefinitionStatus status = 1;
  repeated SketchRelationProblem relations = 2;
  // Dimensions IAnnotation::IsDangling flags that `relations` doesn't
  // already list.
  repeated string dangling_dimensions = 3;
  // A 2D sketch whose plane or face (ISketch::GetReferenceEntity) is gone.
  bool plane_missing = 4;
}

// One of the two (or more) things a mate ties together.
message MateEntityState {
  // What it's attached to: "face", "edge", "vertex", "plane", "axis",
  // "point", "coordinate system", "component", "other"; empty if missing.
  string kind = 1;
  bytes persist_id = 2;
  // The mate lost this reference (IMateEntity2::Reference is null).
  bool missing = 3;
  int32 reference_type = 4;  // swMateEntity2ReferenceType_e
  // The component it's on, when SolidWorks still says (even for a missing
  // reference).
  bytes component_persist_id = 5;
  string component_name = 6;
}

// A feature that fails or warns on rebuild, or a sketch with problems.
message FeatureDiagnosis {
  bytes persist_id = 1;
  string name = 2;
  string type_name = 3;  // IFeature::GetTypeName2
  // Assemblies: set for a component's feature that What's Wrong lists.
  bytes component_persist_id = 4;
  // swFeatureError_e (0 when only the sketch has problems).
  int32 error_code = 5;
  bool warning = 6;
  bool suppressed = 7;
  // SolidWorks' What's Wrong list has it.
  bool whats_wrong = 8;
  // Features it depends on (IFeature::GetParents) and that depend on it
  // (IFeature::GetChildren).
  repeated FeatureRef parents = 9;
  repeated FeatureRef children = 10;
  // Sketches (ProfileFeature, 3DProfileFeature) only.
  SketchDiagnosis sketch = 11;
  // Mates only, in IMate2::MateEntity order.
  repeated MateEntityState mate_entities = 12;
}

message DiagnoseModelResponse {
  Document document = 1;
  // EditRebuild3 ran (it reports failure when features fail, so that's not
  // taken into account).
  bool rebuilt = 2;
  // In feature-tree order; features only What's Wrong knows (a component's)
  // come last.
  repeated FeatureDiagnosis problems = 3;
  // How many features and sketches were looked at.
  int32 checked_features = 4;
  int32 checked_sketches = 5;
  // Set when problems were cut off at the add-in's limit.
  bool truncated = 6;
}

// ---------------------------------------------------------------------------
// Editing features: EditExtrude, EditMate

// swEndConditions_e, the ones EditExtrude can set (those that need no
// reference entity).
enum EndCondition {
  END_CONDITION_UNSPECIFIED = 0;  // requests: keep
  END_CONDITION_BLIND = 1;
  END_CONDITION_THROUGH_ALL = 2;
  // Direction 1 only: depth is the total, split across both sides.
  END_CONDITION_MID_PLANE = 3;
  END_CONDITION_UP_TO_NEXT = 4;
  // Cuts, direction 1 only: through all to both sides.
  END_CONDITION_THROUGH_ALL_BOTH = 5;
  // Up to vertex / surface / body, offset from surface, ...: reported (see
  // raw_end_condition), can't be set.
  END_CONDITION_OTHER = 6;
}

message ExtrudeDirection {
  EndCondition end_condition = 1;
  int32 raw_end_condition = 2;  // swEndConditions_e
  // Meters. Meaningful for blind and mid plane (the total), and as the
  // offset for offset-from-surface.
  double depth = 3;
  // Taper while extruding, radians; 0 = no draft.
  double draft_angle = 4;
  bool draft_outward = 5;
}

message ExtrudeDefinition {
  string name = 1;
  string type_name = 2;  // IFeature::GetTypeName2: Extrusion, Cut, ICE, ...
  bool cut = 3;
  bool thin = 4;  // thin feature (wall thickness isn't editable here)
  // The profile sketch (the extrude's absorbed sketch), if found.
  string sketch_name = 5;
  ExtrudeDirection direction1 = 6;
  // Set when the extrude goes both ways (BothDirections).
  ExtrudeDirection direction2 = 7;
  // Direction 1 points against the sketch normal.
  bool reverse_direction = 8;
  // Cuts: remove the material outside the profile instead of inside.
  bool flip_side_to_cut = 9;
  // Its dimensions (D1@Boss-Extrude1 = depth, ...), for SetDimensionValue.
  repeated DimensionInfo dimensions = 10;
  // swFeatureError_e as of the last rebuild.
  int32 error_code = 11;
  bool error_is_warning = 12;
}

message EditExtrudeRequest {
  FeatureTarget feature = 1;
  // Direction 1. UNSPECIFIED keeps the current one; OTHER is invalid.
  EndCondition end_condition = 2;
  optional double depth = 3;  // meters, > 0
  optional bool reverse_direction = 4;
  // Radians, 0 (no draft) to < pi/2.
  optional double draft_angle = 5;
  optional bool draft_outward = 6;
  optional bool flip_side_to_cut = 7;  // cuts only
  // Direction 2: false removes it. Not with mid plane / through all both.
  optional bool both_directions = 8;
  EndCondition end_condition2 = 9;
  optional double depth2 = 10;
}

message EditExtrudeResponse {
  ExtrudeDefinition before = 1;
  // Unset when the request changed nothing (only `before` is reported).
  ExtrudeDefinition after = 2;
  // Other features whose rebuild error is new or different since the edit.
  repeated FeatureProblem new_errors = 3;
}

message EditMateRequest {
  FeatureTarget mate = 1;
  // UNSPECIFIED keeps the type. Changing to DISTANCE / ANGLE needs a
  // distance / angle unless the mate already has one; LOCK needs two
  // components as entities, and leaving LOCK needs other entities.
  MateType type = 2;
  // Empty keeps the mated entities; otherwise exactly two, as AddMate.
  repeated bytes entity_persist_ids = 3;
  // UNSPECIFIED keeps the alignment.
  MateAlignment alignment = 4;
  optional bool flip = 5;
  optional double distance = 6;  // meters, >= 0
  optional double angle = 7;     // radians, 0..pi
  optional bool lock_rotation = 8;  // concentric only
}

message EditMateResponse {
  MateInfo before = 1;
  MateInfo after = 2;
  // The mated entities after the edit, as DiagnoseModel reports them.
  repeated MateEntityState entities = 3;
  // The mated components, where the solve left them.
  repeated ComponentInfo components = 4;
  // Other features (mates) whose rebuild error is new or different.
  repeated FeatureProblem new_errors = 5;
}

// ---------------------------------------------------------------------------
// CreateReferenceGeometry

// Something reference geometry is built from.
message GeometryRef {
  oneof target {
    // A face, edge or vertex, or a reference plane / axis / point /
    // coordinate system feature, by persist_id from InspectModel.
    bytes model_persist_id = 1;
    // A segment or point of a closed 2D sketch.
    SketchItemRef sketch_item = 2;
    // The part origin.
    bool origin = 3;
    // One of the default planes (found as in CreateRectangleSketch).
    Plane standard_plane = 4;
    // A reference feature by its feature-tree name, e.g. "Plane1".
    string feature_name = 5;
  }
}

// How a reference plane relates to one of its references
// (swRefPlaneReferenceConstraints_e).
enum PlaneConstraint {
  PLANE_CONSTRAINT_UNSPECIFIED = 0;
  PLANE_CONSTRAINT_COINCIDENT = 1;     // through the point / line / plane
  PLANE_CONSTRAINT_PARALLEL = 2;
  PLANE_CONSTRAINT_PERPENDICULAR = 3;
  PLANE_CONSTRAINT_DISTANCE = 4;       // offset from a plane or planar face
  PLANE_CONSTRAINT_ANGLE = 5;          // at an angle to a plane, about a line given as another reference
  PLANE_CONSTRAINT_TANGENT = 6;        // tangent to a curved face
  PLANE_CONSTRAINT_MID_PLANE = 7;      // halfway between two planes (both references)
}

message PlaneReference {
  GeometryRef ref = 1;
  PlaneConstraint constraint = 2;  // UNSPECIFIED is invalid
  double distance = 3;             // DISTANCE: meters, > 0
  double angle = 4;                // ANGLE: radians, > 0
  // The other side of the reference (swRefPlaneReferenceConstraint_OptionFlip).
  bool flip = 5;
}

message ReferencePlaneSpec {
  // One to three, as SolidWorks' first / second / third reference.
  repeated PlaneReference references = 1;
}

message ReferenceAxisSpec {
  // One (a straight edge or sketch line, a cylindrical or conical face, a
  // reference axis) or two (two planes / planar faces, two points /
  // vertices, a point and a plane / face) -- what the Axis command takes.
  repeated GeometryRef references = 1;
}

// swRefPointType_e.
enum ReferencePointKind {
  REFERENCE_POINT_KIND_UNSPECIFIED = 0;
  REFERENCE_POINT_KIND_ARC_CENTER = 1;    // center of a circular edge or sketch arc / circle
  REFERENCE_POINT_KIND_FACE_CENTER = 2;   // center of area of a face
  REFERENCE_POINT_KIND_PROJECTION = 3;    // a vertex / sketch point projected onto a face or plane
  REFERENCE_POINT_KIND_INTERSECTION = 4;  // where two edges / lines cross, or an edge meets a face / plane
  REFERENCE_POINT_KIND_ALONG_CURVE = 5;   // on an edge / sketch segment, see AlongCurve
  REFERENCE_POINT_KIND_AT_POINT = 6;      // at a vertex or sketch point (swRefPointSketchPoint)
}

// swRefPointAlongCurveType_e.
enum AlongCurve {
  ALONG_CURVE_UNSPECIFIED = 0;
  // From one end of the curve: SolidWorks' choice, not necessarily the edge's
  // start as InspectModel reports it.
  ALONG_CURVE_DISTANCE = 1;  // `distance` from that end (and every `distance` after it)
  ALONG_CURVE_PERCENT = 2;   // `percent` (0-100) of the length from that end (likewise)
  ALONG_CURVE_EVENLY = 3;    // `count` points spread evenly over the curve
}

message ReferencePointSpec {
  ReferencePointKind kind = 1;  // UNSPECIFIED is invalid
  repeated GeometryRef references = 2;
  // ALONG_CURVE only.
  AlongCurve along = 3;
  double distance = 4;  // meters, > 0
  double percent = 5;   // 0 to 100
  int32 count = 6;      // how many points, >= 1 (0 = 1)
}

message CoordinateSystemSpec {
  // A vertex, sketch point or reference point; unset = the part origin.
  GeometryRef origin = 1;
  // Each optional (at least one, or a non-origin `origin`): an edge,
  // sketch line or axis along it, a plane or planar face along its normal,
  // or a vertex / point the axis points at.
  GeometryRef x_axis = 2;
  GeometryRef y_axis = 3;
  GeometryRef z_axis = 4;
  bool flip_x = 5;
  bool flip_y = 6;
  bool flip_z = 7;
}

message CreateReferenceGeometryRequest {
  oneof geometry {
    ReferencePlaneSpec plane = 1;
    ReferenceAxisSpec axis = 2;
    ReferencePointSpec point = 3;
    CoordinateSystemSpec coordinate_system = 4;
  }
  // Rename the new feature (with several points: the first one; the others
  // get "<name>2", "<name>3", ...). Empty keeps SolidWorks' name.
  string name = 5;
}

// Where a reference feature is, model space. Which fields are set depends
// on the feature's type:
//   RefPlane:  origin (a point on it), direction (unit normal), x_axis/y_axis (in-plane)
//   RefAxis:   origin (one end), direction (unit, toward the other end), length
//   RefPoint:  origin
//   CoordSys:  origin, x_axis, y_axis, z_axis
message ReferenceGeometry {
  Vec3 origin = 1;
  Vec3 direction = 2;
  Vec3 x_axis = 3;
  Vec3 y_axis = 4;
  Vec3 z_axis = 5;
  double length = 6;  // meters
}

message CreateReferenceGeometryResponse {
  // The new features (one, or several points along a curve), each with
  // `reference` set.
  repeated FeatureInfo features = 1;
}
