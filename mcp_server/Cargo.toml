[package]
name = "mcp_server"
version = "0.5.0"
edition = "2024"
authors = ["Marc Wang"]
description = "SolidWorks MCP server"

[dependencies]
rmcp = { version = "3.0.0-beta.2", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "time"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
kiss3d = "0.47"
# Same major version as kiss3d's; render.rs creates the GPU device itself.
wgpu = "30"
base64 = "0.22"
# f64 affine transforms for assembly placements; same version kiss3d uses.
glam = "0.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# OpenProcess / QueryFullProcessImageNameW: is an instance file's pid still
# SolidWorks (discovery.rs). EnumWindows & co: closing dialogs a macro opens (macro.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
# Version resource (Properties > Details) for mcp_server.exe.
winresource = "0.1"
